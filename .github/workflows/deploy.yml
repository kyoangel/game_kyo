name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read

# Superseded pushes cancel their still-running builds. The deploy job (below) has its own
# non-cancelling `pages` group so a deploy is never aborted midway.

jobs:
  changes:
    runs-on: ubuntu-latest
    concurrency:
      group: changes-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      releases: ${{ steps.filter.outputs.releases }}
      merge10: ${{ steps.filter.outputs.merge10 }}
      merge10x: ${{ steps.filter.outputs.merge10x }}
      pixel-squad: ${{ steps.filter.outputs.pixel-squad }}
      platform: ${{ steps.filter.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Diff against the last commit whose deploy succeeded (not just the previous push), so a
      # cancelled/superseded run never leaves its changes undeployed.
      - name: Find last successfully deployed commit
        id: base
        run: |
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch master --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
          if [ -n "$sha" ] && git cat-file -e "$sha^{commit}" 2>/dev/null; then echo "sha=$sha" >> "$GITHUB_OUTPUT"; fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: |
            releases:
              - 'games/*/game.json'
            merge10:
              - 'workspace/**'
            merge10x:
              - 'workspace-merge10x/**'
            pixel-squad:
              - 'workspace-pixel-squad/**'
            platform:
              - 'packages/**'
              - 'games/**'
              - 'site/**'
              - 'scripts/**'
              - 'templates/**'
              - 'e2e/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vitest.config.ts'
              - 'playwright.config.ts'
              - '.github/workflows/deploy.yml'

  build-merge10:
    needs: changes
    concurrency:
      group: build-merge10-${{ github.ref }}
      cancel-in-progress: true
    if: needs.changes.outputs.merge10 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: workspace/package-lock.json
      - run: npm ci
        working-directory: workspace
      - run: npm run test:unit
        working-directory: workspace
      - run: npx playwright install --with-deps chromium
        working-directory: workspace
      - run: npm run test:e2e
        working-directory: workspace
      - run: npm run build
        working-directory: workspace
      - uses: actions/upload-artifact@v4
        with:
          name: dist-merge10
          path: workspace/dist

  build-merge10x:
    needs: changes
    concurrency:
      group: build-merge10x-${{ github.ref }}
      cancel-in-progress: true
    if: needs.changes.outputs.merge10x == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: workspace-merge10x/package-lock.json
      - run: npm ci
        working-directory: workspace-merge10x
      - run: npm run test:unit
        working-directory: workspace-merge10x
      - run: npx playwright install --with-deps chromium
        working-directory: workspace-merge10x
      - run: npm run test:e2e
        working-directory: workspace-merge10x
      - run: npm run build
        working-directory: workspace-merge10x
      - uses: actions/upload-artifact@v4
        with:
          name: dist-merge10x
          path: workspace-merge10x/dist

  build-pixel-squad:
    needs: changes
    concurrency:
      group: build-pixel-squad-${{ github.ref }}
      cancel-in-progress: true
    if: needs.changes.outputs.pixel-squad == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: workspace-pixel-squad/package-lock.json
      - run: npm ci
        working-directory: workspace-pixel-squad
      - run: npm run test:unit
        working-directory: workspace-pixel-squad
      - run: npx playwright install --with-deps chromium
        working-directory: workspace-pixel-squad
      - run: npm run test:e2e
        working-directory: workspace-pixel-squad
      - run: npm run build
        working-directory: workspace-pixel-squad
      - uses: actions/upload-artifact@v4
        with:
          name: dist-pixel-squad
          path: workspace-pixel-squad/dist

  build-platform:
    needs: changes
    concurrency:
      group: build-platform-${{ github.ref }}
      cancel-in-progress: true
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          PROPERTY_SEEDS: '100'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
      - run: npm run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: dist-site
          path: dist/site

  release-portals:
    needs: [changes, build-platform]
    if: needs.build-platform.result == 'success' && needs.changes.outputs.releases == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:portals
      - run: npm run build:portals
      - name: Create GitHub Releases for new game versions
        run: node scripts/release-portals.ts

  deploy:
    needs: [changes, build-merge10, build-merge10x, build-pixel-squad, build-platform]
    if: |
      always() && !failure() && !cancelled() &&
      (
        needs.build-merge10.result == 'success' ||
        needs.build-merge10x.result == 'success' ||
        needs.build-pixel-squad.result == 'success' ||
        needs.build-platform.result == 'success'
      )
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: needs.build-merge10.result == 'success'
        with:
          name: dist-merge10
          path: dist/merge10
      - name: Deploy merge10
        if: needs.build-merge10.result == 'success'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/merge10
          target-folder: merge10
          branch: gh-pages
          clean: false

      - uses: actions/download-artifact@v4
        if: needs.build-merge10x.result == 'success'
        with:
          name: dist-merge10x
          path: dist/merge10x
      - name: Deploy merge10x
        if: needs.build-merge10x.result == 'success'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/merge10x
          target-folder: merge10x
          branch: gh-pages
          clean: false

      - uses: actions/download-artifact@v4
        if: needs.build-pixel-squad.result == 'success'
        with:
          name: dist-pixel-squad
          path: dist/pixel-squad
      - name: Deploy pixel-squad
        if: needs.build-pixel-squad.result == 'success'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/pixel-squad
          target-folder: pixel-squad
          branch: gh-pages
          clean: false

      - uses: actions/download-artifact@v4
        if: needs.build-platform.result == 'success'
        with:
          name: dist-site
          path: dist/site
      - name: Deploy site (lobby + new games)
        if: needs.build-platform.result == 'success'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/site
          target-folder: .
          branch: gh-pages
          clean: false

      # The gh-pages branch stays the accumulated site state (so games whose build was skipped
      # are preserved); publish it through the Pages Actions deploy instead of the branch build.
      - name: Check out accumulated site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site
      - run: rm -rf _site/.git
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
