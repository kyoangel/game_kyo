name: Nightly full property tests

on:
  schedule:
    - cron: '0 18 * * *' # 02:00 Asia/Taipei
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          PROPERTY_SEEDS: '300'
