<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Math Merge 10X</title>
  <link rel="manifest" href="/game_kyo/merge10x/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Math Merge 10X" />
  <link rel="apple-touch-icon" href="/game_kyo/merge10x/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/game_kyo/merge10x/icons/icon.svg" />
  <style>
    html, body { overscroll-behavior: none; overflow-x: hidden; margin: 0; }
    body {
      display: flex; justify-content: center; align-items: flex-start;
      padding-top: 16px; min-height: 100dvh;
      background: #111; box-sizing: border-box;
    }
    #game-wrapper { display: flex; flex-direction: column; align-items: center; max-width: 100vw; }
    #game-container { position: relative; }
    #hud {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; background: #1a1a2e; border-radius: 0 0 8px 8px;
      box-sizing: border-box;
    }
    #hud-score, #hud-best { color: #fff; font-family: sans-serif; font-size: 15px; }
    #hud-buttons { display: flex; gap: 6px; }
    .hud-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; font-size: 18px; cursor: pointer;
    }
    /* Size picker overlay */
    #size-picker {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.8);
    }
    #size-picker[hidden] { display: none; }
    #size-picker-card {
      background: #1f2937; border-radius: 16px; padding: 32px 40px;
      text-align: center; font-family: sans-serif; color: #fff;
    }
    #size-picker-card h2 { margin: 0 0 8px; font-size: 22px; }
    #size-picker-card p { color: #9ca3af; font-size: 13px; margin: 0 0 28px; }
    .size-btn {
      display: block; width: 100%; margin-bottom: 12px;
      padding: 16px; border-radius: 10px; border: 2px solid #374151;
      background: #111827; color: #fff; font-size: 18px; font-weight: bold;
      cursor: pointer; font-family: sans-serif;
    }
    .size-btn:last-child { margin-bottom: 0; }
    .size-btn[data-size="5"] { border-color: #4ade80; background: rgba(74,222,128,0.08); }
    .size-sub { font-size: 12px; color: #6b7280; font-weight: normal; display: block; margin-top: 2px; }
    /* Game over */
    #game-over {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6);
    }
    #game-over[hidden] { display: none; }
    #game-over-card {
      background: #1f2937; border-radius: 12px; padding: 24px 32px;
      text-align: center; font-family: sans-serif; color: #fff;
    }
    #game-over-card h2 { margin: 0 0 12px; }
    #game-over-card p { margin: 4px 0; font-size: 14px; color: #cbd5e1; }
    #game-over-badge { display: inline-block; margin-top: 8px; background: #fde047; color: #422006; font-size: 12px; font-weight: bold; border-radius: 999px; padding: 2px 10px; }
    #game-over-badge.hidden { display: none; }
    #game-over-actions { display: flex; gap: 8px; justify-content: center; margin-top: 16px; }
    #play-again { background: #4ade80; color: #052e16; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; padding: 8px 20px; cursor: pointer; }
    #change-size { background: transparent; color: #9ca3af; border: 1px solid #374151; border-radius: 8px; font-size: 13px; padding: 8px 14px; cursor: pointer; }
    /* Score popup */
    #score-popup {
      position: absolute; bottom: 8px; left: 12px;
      color: #fde047; font-family: sans-serif; font-weight: bold; font-size: 20px;
      pointer-events: none; opacity: 0; z-index: 10;
    }
    #score-popup.animate { animation: score-popup-float 800ms ease-out forwards; }
    @keyframes score-popup-float {
      0%   { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }
    /* Combo badge */
    #combo-badge {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%) scale(0);
      background: #f59e0b; color: #1c0a00; font-family: sans-serif; font-weight: bold;
      font-size: 28px; border-radius: 999px; padding: 10px 28px;
      pointer-events: none; opacity: 0; z-index: 20; white-space: nowrap;
    }
    #combo-badge.animate { animation: combo-appear 800ms ease-out forwards; }
    @keyframes combo-appear {
      0%   { opacity: 1; transform: translate(-50%,-50%) scale(0.3); }
      12%  { transform: translate(-50%,-50%) scale(1.1); }
      19%  { opacity: 1; transform: translate(-50%,-50%) scale(1.0); }
      81%  { opacity: 1; transform: translate(-50%,-50%) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%,-50%) scale(1.0); }
    }
    /* Trophy toast */
    #trophy-toast {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: #fde047; color: #422006; font-family: sans-serif; font-weight: bold;
      font-size: 14px; border-radius: 8px; padding: 8px 16px;
      pointer-events: none; opacity: 0; z-index: 30; white-space: nowrap;
    }
    #trophy-toast.animate { animation: trophy-toast-appear 2200ms ease-out forwards; }
    @keyframes trophy-toast-appear {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0); }
      70%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-8px); }
    }
    /* Trophy modal */
    #trophy-modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; }
    #trophy-modal[hidden] { display: none; }
    #trophy-modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.65); }
    #trophy-modal-card {
      position: relative; background: #1f2937; border: 1px solid #374151;
      border-radius: 12px; padding: 20px 24px; max-width: 320px; width: 90%;
      max-height: 80vh; overflow-y: auto; color: #e5e7eb; font-family: sans-serif; z-index: 1;
    }
    #trophy-modal-card h3 { margin: 0 0 14px; font-size: 15px; color: #f9fafb; }
    #trophy-modal-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: #9ca3af; font-size: 18px; cursor: pointer; }
    #trophy-modal-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
    .tm-category-header { font-size: 10px; font-weight: bold; color: #6b7280; text-transform: uppercase; letter-spacing: 0.07em; padding: 8px 0 4px; border-top: 1px solid #374151; margin-top: 4px; }
    .tm-category-header:first-child { border-top: none; margin-top: 0; padding-top: 0; }
    .tm-single { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #1f2937; }
    .tm-single-ico { font-size: 20px; }
    .tm-single-body strong { color: #e5e7eb; font-size: 12px; display: block; }
    .tm-single-body small { color: #6b7280; font-size: 10px; }
    .tm-single.locked .tm-single-ico { filter: grayscale(1) opacity(0.25); }
    .tm-single.locked .tm-single-body strong { color: #4b5563; }
    .tm-prog-row { padding: 6px 0; border-bottom: 1px solid #1f2937; }
    .tm-prog-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .tm-prog-label { color: #e5e7eb; font-size: 12px; font-weight: 600; }
    .tm-prog-val { color: #9ca3af; font-size: 10px; }
    .tm-medals { display: flex; margin-bottom: 4px; }
    .tm-tier { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; }
    .tm-tier .tm-ico { font-size: 16px; }
    .tm-tier .tm-thr { font-size: 9px; color: #9ca3af; }
    .tm-tier.locked .tm-ico { filter: grayscale(1) opacity(0.22); }
    .tm-tier.locked .tm-thr { color: #374151; }
    .tm-bar { height: 3px; background: #374151; border-radius: 2px; overflow: hidden; }
    .tm-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #7c3aed, #a78bfa); }
    /* iOS hint */
    #ios-hint {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: #1e3a5f; color: #bfdbfe; font-family: sans-serif; font-size: 13px;
      border-radius: 8px; padding: 10px 16px; z-index: 100; white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5); cursor: pointer;
    }
  </style>
  <script type="module" crossorigin src="/game_kyo/merge10x/assets/index-CXxeiwkK.js"></script>
</head>
<body>
  <div id="ios-hint" style="display:none"></div>
  <!-- Size picker overlay -->
  <div id="size-picker">
    <div id="size-picker-card">
      <h2>Math Merge 10X</h2>
      <p>選擇遊戲盤面大小</p>
      <button class="size-btn" data-size="5">
        5 × 5
        <span class="size-sub">推薦・策略感更強</span>
      </button>
      <button class="size-btn" data-size="4">
        4 × 4
        <span class="size-sub">快速局・輕鬆遊玩</span>
      </button>
    </div>
  </div>
  <div id="game-wrapper">
    <div id="game-container">
      <canvas id="game" width="480" height="480"></canvas>
      <div id="score-popup"></div>
      <div id="combo-badge"></div>
      <div id="trophy-toast"></div>
      <div id="game-over" hidden>
        <div id="game-over-card">
          <h2>Game Over</h2>
          <p id="game-over-score"></p>
          <p id="game-over-best"></p>
          <p id="game-over-badge" class="hidden">★ 新紀錄！</p>
          <div id="game-over-actions">
            <button id="play-again">再玩一次</button>
            <button id="change-size">換盤面</button>
          </div>
        </div>
      </div>
    </div>
    <div id="hud">
      <span id="hud-score">Score: 0</span>
      <span id="hud-best">Best: 0</span>
      <div id="hud-buttons">
        <button class="hud-btn" id="hud-trophy" aria-label="生涯獎盃">🏆</button>
        <button class="hud-btn" id="hud-mute" aria-label="靜音">🔊</button>
      </div>
    </div>
    <div id="trophy-modal" hidden>
      <div id="trophy-modal-overlay"></div>
      <div id="trophy-modal-card">
        <button id="trophy-modal-close" aria-label="關閉">✕</button>
        <h3>生涯獎盃</h3>
        <ul id="trophy-modal-list"></ul>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      var isStandalone = ('standalone' in navigator) && navigator.standalone;
      var shown = localStorage.getItem('merge10xIosHintShown');
      if (!isIOS || isStandalone || shown) return;
      localStorage.setItem('merge10xIosHintShown', '1');
      setTimeout(function () {
        var el = document.getElementById('ios-hint');
        if (!el) return;
        el.textContent = '💡 用 Safari 分享 → 加入主畫面，可離線遊玩（點擊關閉）';
        el.style.display = 'block';
        el.addEventListener('click', function () { el.style.display = 'none'; });
        setTimeout(function () { el.style.display = 'none'; }, 6000);
      }, 2000);
    }());
  </script>
</body>
</html>
