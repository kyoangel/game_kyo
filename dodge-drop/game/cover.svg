<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1699"/>
      <stop offset="0.55" stop-color="#1e0d5c"/>
      <stop offset="1" stop-color="#0d062b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ff0ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3ff0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe14d" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffe14d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <linearGradient id="pinkTrail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orangeTrail" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffa14d" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffa14d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streakCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ff0ff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#3ff0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="streakPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ff4fa3" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd0ea" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="dodgeTrail" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0" stop-color="#3ff0ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3ff0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep neon night backdrop -->
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Subtle perspective speed grid -->
  <g stroke="#9ee9ff" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="320" y1="0" x2="40" y2="360"/>
    <line x1="320" y1="0" x2="180" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="320" y1="0" x2="460" y2="360"/>
    <line x1="320" y1="0" x2="600" y2="360"/>
    <line x1="0" y1="110" x2="640" y2="110" stroke-opacity="0.08"/>
    <line x1="0" y1="210" x2="640" y2="210" stroke-opacity="0.1"/>
    <line x1="0" y1="300" x2="640" y2="300" stroke-opacity="0.14"/>
  </g>

  <!-- Edge speed streaks -->
  <g>
    <rect x="18" y="10" width="4" height="150" rx="2" fill="url(#streakCyan)"/>
    <rect x="44" y="120" width="3" height="190" rx="1.5" fill="url(#streakPink)"/>
    <rect x="86" y="-20" width="2.5" height="140" rx="1.2" fill="url(#streakCyan)" opacity="0.7"/>
    <rect x="556" y="40" width="3" height="170" rx="1.5" fill="url(#streakCyan)"/>
    <rect x="594" y="130" width="4" height="180" rx="2" fill="url(#streakPink)"/>
    <rect x="618" y="-10" width="3" height="160" rx="1.5" fill="url(#streakCyan)" opacity="0.8"/>
  </g>

  <!-- Motion-blur trails above falling blocks -->
  <rect x="74" y="0" width="128" height="96" fill="url(#pinkTrail)"/>
  <rect x="458" y="0" width="124" height="106" fill="url(#orangeTrail)"/>
  <rect x="206" y="120" width="146" height="130" fill="url(#pinkTrail)"/>
  <rect x="506" y="150" width="84" height="92" fill="url(#pinkTrail)"/>

  <!-- Block neon outer glow -->
  <g filter="url(#blur)" opacity="0.85">
    <rect x="74" y="64" width="128" height="36" rx="9" fill="#ff4fa3"/>
    <rect x="458" y="74" width="124" height="36" rx="9" fill="#ffa14d"/>
    <rect x="206" y="218" width="146" height="40" rx="10" fill="#ff4fa3"/>
    <rect x="506" y="214" width="84" height="34" rx="9" fill="#ff4fa3"/>
  </g>

  <!-- Crisp falling blocks -->
  <g stroke-width="3">
    <rect x="74" y="64" width="128" height="36" rx="9" fill="#ff4fa3" stroke="#ffd0ea"/>
    <rect x="458" y="74" width="124" height="36" rx="9" fill="#ffa14d" stroke="#ffe0bd"/>
    <rect x="206" y="218" width="146" height="40" rx="10" fill="#ff4fa3" stroke="#ffd0ea"/>
    <rect x="506" y="214" width="84" height="34" rx="9" fill="#ff4fa3" stroke="#ffd0ea"/>
  </g>

  <!-- Player swerving right with high-speed lateral swoosh -->
  <path d="M 275 316 Q 345 312 406 286 L 406 254 Q 345 278 265 296 Z" fill="url(#dodgeTrail)"/>
  <circle cx="408" cy="272" r="52" fill="url(#glow)"/>
  <g transform="translate(408, 272) rotate(11)">
    <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#3ff0ff" stroke="#ffffff" stroke-width="3.5"/>
    <circle cx="-8" cy="-9" r="6" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Near-miss golden sparks between grazing block and player -->
  <circle cx="364" cy="252" r="26" fill="url(#sparkGlow)" opacity="0.75"/>
  <g stroke="#ffe14d" stroke-width="3.5" stroke-linecap="round">
    <line x1="364" y1="252" x2="344" y2="234"/>
    <line x1="364" y1="252" x2="386" y2="230"/>
    <line x1="364" y1="252" x2="348" y2="274"/>
    <line x1="364" y1="252" x2="378" y2="280"/>
  </g>
  <circle cx="364" cy="252" r="5" fill="#ffffff"/>

  <!-- Collectible star -->
  <polygon points="552,292 559,310 578,312 563,324 568,342 552,331 536,342 541,324 526,312 545,310" transform="translate(-8,-12)" fill="#ffe14d" stroke="#ffffff" stroke-width="2"/>

  <!-- Bold slanted neon title with chromatic speed echo -->
  <g transform="skewX(-10) translate(28, 0)">
    <text x="316" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="74" font-weight="900" fill="#ff4fa3" opacity="0.75" text-anchor="middle">NEON RUSH</text>
    <text x="324" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="74" font-weight="900" fill="#3ff0ff" opacity="0.75" text-anchor="middle">NEON RUSH</text>
    <text x="320" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="74" font-weight="900" fill="#ffffff" stroke="#1a1033" stroke-width="9" paint-order="stroke" text-anchor="middle">NEON RUSH</text>
  </g>
</svg>
