<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Game Factory</title>
  <link rel="manifest" href="%BASE_URL%manifest.json" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
  <style>
    html, body {
      overscroll-behavior: none;
    }
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 16px;
      min-height: 100vh;
      background: #111;
      box-sizing: border-box;
    }
    canvas {
      background: #222;
      border: 1px solid #444;
      display: block;
    }
    #game-container {
      position: relative;
    }
    #game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #1a1a2e;
      border-radius: 0 0 8px 8px;
      box-sizing: border-box;
      gap: 8px;
    }
    #hud-score,
    #hud-best {
      color: #fff;
      font-family: sans-serif;
      font-size: 15px;
      white-space: nowrap;
    }
    #hud-palette-toggle,
    #hud-mute {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    #hud-powerups {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .hud-powerup-btn {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }
    .hud-powerup-btn[data-active="true"] {
      border-color: #f59e0b;
      background: rgba(245,158,11,0.25);
    }
    .hud-powerup-count {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 10px;
      font-weight: bold;
      color: #fde047;
      pointer-events: none;
    }
    #score-popup {
      position: absolute;
      bottom: 8px;
      left: 12px;
      color: #fde047;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 20px;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
    }
    #score-popup.animate {
      animation: score-popup-float 800ms ease-out forwards;
    }
    @keyframes score-popup-float {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-30px);
      }
    }
    #game-over {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
    }
    #game-over[hidden] {
      display: none;
    }
    #game-over-card {
      background: #1f2937;
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      font-family: sans-serif;
      color: #fff;
    }
    #game-over-card h2 {
      margin: 0 0 12px;
    }
    #game-over-card p {
      margin: 4px 0;
      font-size: 14px;
      color: #cbd5e1;
    }
    #game-over-badge {
      display: inline-block;
      margin-top: 8px;
      background: #fde047;
      color: #422006;
      font-size: 12px;
      font-weight: bold;
      border-radius: 999px;
      padding: 2px 10px;
    }
    #game-over-badge.hidden {
      display: none;
    }
    #play-again {
      margin-top: 16px;
      background: #4ade80;
      color: #052e16;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      padding: 8px 20px;
      cursor: pointer;
    }
    #combo-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: #f59e0b;
      color: #1c0a00;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 28px;
      border-radius: 999px;
      padding: 10px 28px;
      pointer-events: none;
      opacity: 0;
      z-index: 20;
      white-space: nowrap;
    }
    #combo-badge.animate {
      animation: combo-appear 800ms ease-out forwards;
    }
    @keyframes combo-appear {
      0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.3); }
      12%  { transform: translate(-50%, -50%) scale(1.1); }
      19%  { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
      81%  { opacity: 1; transform: translate(-50%, -50%) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.0); }
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container">
      <canvas id="game" width="480" height="480"></canvas>
      <div id="score-popup"></div>
      <div id="combo-badge"></div>
      <div id="game-over" hidden>
        <div id="game-over-card">
          <h2>Game Over</h2>
          <p id="game-over-score"></p>
          <p id="game-over-best"></p>
          <p id="game-over-badge" class="hidden">★ 新紀錄！</p>
          <button id="play-again">再玩一次</button>
        </div>
      </div>
    </div>
    <div id="hud">
      <span id="hud-score">Score: 0</span>
      <span id="hud-best">Best: 0</span>
      <div id="hud-powerups"></div>
      <button id="hud-palette-toggle" aria-label="切換配色">🎨</button>
      <button id="hud-mute" aria-label="靜音">🔊</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("%BASE_URL%sw.js");
      });
    }
  </script>
</body>
</html>
