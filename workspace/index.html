<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Factory</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
    }
    canvas {
      background: #222;
      border: 1px solid #444;
      display: block;
    }
    #game-container {
      position: relative;
    }
    #palette-toggle {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
    }
    #score-popup {
      position: absolute;
      top: 30px;
      left: 12px;
      color: #fde047;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 20px;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
    }
    #score-popup.animate {
      animation: score-popup-float 800ms ease-out forwards;
    }
    @keyframes score-popup-float {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-30px);
      }
    }
    #game-over {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
    }
    #game-over[hidden] {
      display: none;
    }
    #game-over-card {
      background: #1f2937;
      border-radius: 12px;
      padding: 24px 32px;
      text-align: center;
      font-family: sans-serif;
      color: #fff;
    }
    #game-over-card h2 {
      margin: 0 0 12px;
    }
    #game-over-card p {
      margin: 4px 0;
      font-size: 14px;
      color: #cbd5e1;
    }
    #game-over-badge {
      display: inline-block;
      margin-top: 8px;
      background: #fde047;
      color: #422006;
      font-size: 12px;
      font-weight: bold;
      border-radius: 999px;
      padding: 2px 10px;
    }
    #game-over-badge.hidden {
      display: none;
    }
    #play-again {
      margin-top: 16px;
      background: #4ade80;
      color: #052e16;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      padding: 8px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="800" height="800"></canvas>
    <button id="palette-toggle" aria-label="切換配色">🎨</button>
    <div id="score-popup"></div>
    <div id="game-over" hidden>
      <div id="game-over-card">
        <h2>Game Over</h2>
        <p id="game-over-score"></p>
        <p id="game-over-best"></p>
        <p id="game-over-badge" class="hidden">★ 新紀錄！</p>
        <button id="play-again">再玩一次</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js");
      });
    }
  </script>
</body>
</html>
